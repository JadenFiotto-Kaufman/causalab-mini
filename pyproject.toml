[project]
name = "causalab-mini"
version = "0.0.1"
description = "A clean-room, deliberately small reimplementation of causalab's intervention engine."
requires-python = ">=3.10"
dependencies = [
    "nnsight",
    "nnterp",
    "torch",
    # a trained featurizer leaves the run as a safetensors bundle.
    "safetensors",
    # nnterp defaults device_map="auto", and transformers 5 refuses a device_map
    # without accelerate installed.
    "accelerate",
    # the plan-shaped authoring format is pydantic models (nnsight already
    # pulls it in; declared here because we import it directly).
    "pydantic",
]

[project.scripts]
causalab-mini = "causalab_mini.cli:main"

[dependency-groups]
dev = ["pytest"]

# nnsight and nnterp are NOT releases here: they are the shared working
# checkouts this machine develops against, installed editable. That means they
# can move underneath this project without anything here changing — a `git
# checkout` in either tree is, for us, a silent dependency upgrade. At the time
# of writing /home/localjadenfk/wd/nnsight-dev-parent is on dev at 52cf9231
# (includes the #761 drill-race fix) and /home/localjadenfk/wd/nnterp is on
# 0.8-refactor at 27c8c26 (includes #90, model.order). If a run stops
# reproducing, check those two HEADs first.
[tool.uv.sources]
nnsight = { path = "/home/localjadenfk/wd/nnsight-dev-parent", editable = true }
nnterp = { path = "/home/localjadenfk/wd/nnterp", editable = true }

# nnterp declares `nnsight>=0.8`, but the nnsight dev checkout's scm version is
# an rc (0.8.0rc…, which sorts BELOW 0.8). The override relaxes that one
# constraint so the editable checkout resolves; delete it once nnsight tags 0.8.0.
[tool.uv]
override-dependencies = ["nnsight>=0.8.0rc1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["causalab_mini*"]

[tool.setuptools.package-data]
causalab_mini = ["py.typed"]

# The type checker: `uvx pyright`. `venvPath`/`venv` point it at this project's
# environment so torch, nnsight and nnterp resolve; without them every import
# of a dependency is an error and nothing else is visible.
[tool.pyright]
include = ["causalab_mini", "tests"]
venvPath = "."
venv = ".venv"
# nnterp is installed editable through an import-hook finder rather than a path
# entry, so a static checker cannot see it without being told where it is.
extraPaths = ["/home/localjadenfk/wd/nnterp"]
typeCheckingMode = "standard"
